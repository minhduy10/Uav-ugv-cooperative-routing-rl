# ============================================================
# UAV-UGV Routing RL - Small Configuration
# ============================================================

scale_name: Small

# Scenario
num_tasks: 30
map_size: 16.0

# ============================================================
# Training
# ============================================================

training:
  # Phase 1: Behavioral Cloning
  bc_epochs: 40

  # Phase 2: PPO Fine-tuning
  rl_episodes: 160

  # Phase 3: Self-Imitation Learning
  sil_episodes: 200

  # Optimizer
  learning_rate: 0.0002

  # Loss weights
  bc_weight: 1.0
  sil_weight: 0.5

  # PPO exploration temperature
  rl_temperature_start: 1.5
  rl_temperature_end: 0.7

  # SIL exploration temperature
  sil_temperature: 0.8

  # Maximum episode length:
  #
  # max_steps ≈ num_nodes * max_steps_multiplier
  max_steps_multiplier: 5

  # Reproducibility
  seed: 42


# ============================================================
# Expert planner
# ============================================================

expert:
  # Available:
  #   heuristic
  #   cpsat
  expert_solver: heuristic

  # Used only when expert_solver = cpsat
  cpsat_limit_s: 10.0